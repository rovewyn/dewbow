<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1254" height="1254" viewBox="0 0 1254 1254"
     role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">dewbow logo</title>
  <desc id="logo-description">Five colorful robot characters connected by a rainbow arch on a transparent background.</desc>

  <defs>
    <linearGradient id="rainbow-gradient" x1="150" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e735ff" />
      <stop offset="0.19" stop-color="#ff43d9" />
      <stop offset="0.31" stop-color="#ff9c08" />
      <stop offset="0.48" stop-color="#ffce0a" />
      <stop offset="0.57" stop-color="#a4ef27" />
      <stop offset="0.72" stop-color="#80e83c" />
      <stop offset="0.82" stop-color="#0bd6e9" />
      <stop offset="1" stop-color="#00bcf6" />
    </linearGradient>
    <linearGradient id="purple-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7844ff" />
      <stop offset="1" stop-color="#7131f7" />
    </linearGradient>
    <linearGradient id="red-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d5c" />
      <stop offset="1" stop-color="#ff494c" />
    </linearGradient>
    <linearGradient id="yellow-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf12" />
      <stop offset="1" stop-color="#ffc300" />
    </linearGradient>
    <linearGradient id="green-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13b957" />
      <stop offset="1" stop-color="#08ab50" />
    </linearGradient>
    <linearGradient id="blue-body-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087cff" />
      <stop offset="1" stop-color="#0860ff" />
    </linearGradient>
    <linearGradient id="purple-face-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6ff" />
      <stop offset="1" stop-color="#eee3ff" />
    </linearGradient>
    <linearGradient id="red-face-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef" />
      <stop offset="1" stop-color="#ffece5" />
    </linearGradient>
    <linearGradient id="yellow-face-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset="1" stop-color="#fff3df" />
    </linearGradient>
    <linearGradient id="green-face-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fff0" />
      <stop offset="1" stop-color="#e2f5e5" />
    </linearGradient>
    <linearGradient id="blue-face-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7ff" />
      <stop offset="1" stop-color="#dce9ff" />
    </linearGradient>
    <linearGradient id="eye-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001c5b" />
      <stop offset="1" stop-color="#04266d" />
    </linearGradient>
  </defs>

  <g id="rainbow" inkscape:groupmode="layer" inkscape:label="Rainbow">
    <path id="rainbow-arch" d="M 161 809 C 254 585 419 456 627 458 C 841 457 1017 609 1085 821"
          fill="none" stroke="url(#rainbow-gradient)" stroke-width="72" stroke-linecap="round" />
  </g>

  <g id="purple-robot" inkscape:groupmode="layer" inkscape:label="Purple triangle robot"
     transform="translate(178 865) rotate(-6)">
    <g id="purple-antennas" fill="url(#purple-body-gradient)">
      <path d="M -65 -100 L -46 -43" fill="none" stroke="url(#purple-body-gradient)" stroke-width="19" stroke-linecap="round" />
      <circle cx="-65" cy="-117" r="30" />
    </g>
    <g id="purple-body" fill="url(#purple-body-gradient)">
      <path d="M -27 -97 Q 0 -130 27 -97 L 109 45 Q 137 87 85 87 H -85 Q -137 87 -109 45 Z" />
    </g>
    <g id="purple-face" fill="url(#purple-face-gradient)">
      <path d="M -20 -56 Q 0 -82 20 -56 L 60 15 Q 83 54 41 54 H -41 Q -83 54 -60 15 Z" />
    </g>
    <g id="purple-eyes" fill="url(#eye-gradient)">
      <circle cx="0" cy="0" r="21" />
    </g>
  </g>

  <g id="red-robot" inkscape:groupmode="layer" inkscape:label="Red square robot"
     transform="translate(366 602) rotate(-25)">
    <g id="red-antennas" fill="url(#red-body-gradient)">
      <path d="M -40 -134 V -85 M 0 -110 V -84" fill="none" stroke="url(#red-body-gradient)" stroke-width="18" stroke-linecap="round" />
      <circle cx="-40" cy="-153" r="30" />
      <circle cx="0" cy="-111" r="20" />
    </g>
    <g id="red-body" fill="url(#red-body-gradient)">
      <rect x="-100" y="-96" width="200" height="192" rx="42" />
    </g>
    <g id="red-face" fill="url(#red-face-gradient)">
      <rect x="-70" y="-65" width="140" height="130" rx="28" />
    </g>
    <g id="red-eyes" fill="url(#eye-gradient)">
      <rect x="-42" y="-23" width="23" height="46" rx="11.5" />
      <rect x="15" y="-23" width="23" height="46" rx="11.5" />
    </g>
  </g>

  <g id="yellow-robot" inkscape:groupmode="layer" inkscape:label="Yellow round robot"
     transform="translate(628 450) rotate(18)">
    <g id="yellow-antennas" fill="url(#yellow-body-gradient)">
      <path d="M 27 -113 V -71 M 74 -100 L 65 -68" fill="none" stroke="url(#yellow-body-gradient)" stroke-width="23" stroke-linecap="round" />
      <circle cx="27" cy="-127" r="24" />
      <circle cx="74" cy="-111" r="21" />
    </g>
    <g id="yellow-body" fill="url(#yellow-body-gradient)">
      <ellipse cx="0" cy="0" rx="100" ry="102" />
    </g>
    <g id="yellow-face" fill="url(#yellow-face-gradient)">
      <circle cx="0" cy="0" r="70" />
    </g>
    <g id="yellow-eyes" fill="url(#eye-gradient)">
      <circle cx="0" cy="0" r="37" />
      <circle id="yellow-eye-highlight" cx="8" cy="-15" r="10" fill="#fffdf7" />
    </g>
  </g>

  <g id="green-robot" inkscape:groupmode="layer" inkscape:label="Green hexagon robot"
     transform="translate(914 592) rotate(-20)">
    <g id="green-antennas" fill="url(#green-body-gradient)">
      <path d="M 75 -42 L 128 -82" fill="none" stroke="url(#green-body-gradient)" stroke-width="19" stroke-linecap="round" />
      <circle cx="128" cy="-82" r="26" />
    </g>
    <g id="green-body" fill="url(#green-body-gradient)">
      <path d="M -44 -102 H 44 Q 58 -102 65 -90 L 109 -13 Q 116 0 109 13 L 65 90 Q 58 102 44 102 H -44 Q -58 102 -65 90 L -109 13 Q -116 0 -109 -13 L -65 -90 Q -58 -102 -44 -102 Z" />
    </g>
    <g id="green-face" fill="url(#green-face-gradient)">
      <path d="M -31 -68 H 31 Q 39 -68 44 -60 L 74 -9 Q 79 0 74 9 L 44 60 Q 39 68 31 68 H -31 Q -39 68 -44 60 L -74 9 Q -79 0 -74 -9 L -44 -60 Q -39 -68 -31 -68 Z" />
    </g>
    <g id="green-eyes" fill="url(#eye-gradient)">
      <circle cx="-25" cy="-15" r="15" />
      <circle cx="14" cy="24" r="15" />
    </g>
  </g>

  <g id="blue-robot" inkscape:groupmode="layer" inkscape:label="Blue teardrop robot"
     transform="translate(1096 878) rotate(4)">
    <g id="blue-antennas" fill="url(#blue-body-gradient)">
      <path d="M 52 -74 L 77 -127" fill="none" stroke="url(#blue-body-gradient)" stroke-width="19" stroke-linecap="round" />
      <circle cx="77" cy="-141" r="26" />
    </g>
    <g id="blue-body" fill="url(#blue-body-gradient)">
      <path d="M -8 -132 Q 12 -155 30 -128 L 79 -55 C 125 8 100 61 49 78 C -5 101 -70 72 -88 29 C -103 -5 -93 -34 -69 -62 Z" />
    </g>
    <g id="blue-face" fill="url(#blue-face-gradient)">
      <path d="M -49 -46 C -34 -55 -12 -45 15 -46 C 44 -47 56 -34 67 -13 C 97 28 43 66 5 62 C -29 61 -57 44 -66 18 C -78 -8 -73 -30 -49 -46 Z" />
    </g>
    <g id="blue-eyes" fill="url(#eye-gradient)">
      <rect x="-48" y="-18" width="92" height="26" rx="13" />
    </g>
  </g>
</svg>
