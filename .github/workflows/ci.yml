name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Check product versions
        run: npm run version:check
      - name: Install dependencies
        run: npm ci
      - name: Install pinned stable Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Build workspaces
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build executable and synthetic native fixture
        run: cargo build --workspace --bins --examples
      - name: Test Rust crates
        run: cargo test --workspace --all-targets
      - name: Test SDK, Web, contracts and Rust lifecycle
        run: npm test
      - name: Check SDK package contents
        if: runner.os == 'Linux'
        run: npm pack --workspace @dewbow/sdk --dry-run --ignore-scripts
