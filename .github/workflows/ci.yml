name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci
      - name: Build workspaces
        run: npm run build
      - name: Test service journal
        working-directory: packages/core-protocol
        run: node --test tests/*.test.mjs
      - name: Test SDK
        working-directory: packages/core-sdk
        run: node --test tests/*.test.mjs
      - name: Test conversation projection
        working-directory: apps/core-web
        run: node --test tests/*.test.mjs
      - name: Test shared chat model
        working-directory: packages/core-ui
        run: node --test tests/*.test.mjs
      - name: Test host daemon
        working-directory: apps/core-host-daemon
        run: node --test tests/*.test.mjs
      - name: Test Control Plane
        working-directory: apps/core-control-plane
        run: node --test tests/*.test.mjs
      - name: Test Team backend
        working-directory: apps/team-backend
        run: node --test tests/*.test.mjs
      - name: Test Team conversation projection
        working-directory: apps/team-web
        run: node --test tests/*.test.mjs
      - name: Test Team to Core HTTP integration
        run: node --test scripts/tests/*.test.mjs
      - name: Check SDK package contents
        if: runner.os == 'Linux'
        run: npm pack --workspace @dewbow/core-sdk --dry-run --ignore-scripts
      - name: Check service configuration
        if: runner.os == 'Linux'
        env:
          DEWBOW_HOST_ID: example-host
        run: |
          node apps/core-host-daemon/dist/cli.js --check
          node apps/core-control-plane/dist/cli.js --check
          DEWBOW_TEAM_OPERATOR_TOKEN=synthetic-team-operator-credential node apps/team-backend/dist/cli.js --check
      - name: Check local operation scripts
        if: runner.os == 'Linux'
        run: |
          node --check scripts/init-local.mjs
          node --check scripts/local-config.mjs
          node --check scripts/local-live.mjs
          node --check scripts/local-live-controller.mjs
          node --check scripts/local-live-state.mjs
          node --check scripts/smoke.mjs
