name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Create a public GitHub Release from the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate versions and publication inputs
        id: version
        shell: bash
        env:
          DEWBOW_REF_TYPE: ${{ github.ref_type }}
          DEWBOW_REF_NAME: ${{ github.ref_name }}
          DEWBOW_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          version=$(node scripts/sync-version.mjs --print)
          if [ "$DEWBOW_REF_TYPE" = tag ]; then
            node scripts/sync-version.mjs --check --tag "$DEWBOW_REF_NAME"
            git merge-base --is-ancestor HEAD origin/main
          fi
          if [ "$DEWBOW_PUBLISH" = true ]; then
            test "$DEWBOW_REF_TYPE" = tag
            test -s "docs/release-notes/$version.md"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      DEWBOW_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Check product versions
        run: npm run version:check
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Rust and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.99.0 "$DEWBOW_TARGET"
      - name: Build Web before Rust
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check Rust formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build executable and synthetic native fixture
        run: cargo build --locked --workspace --bins --examples
      - name: Test Rust, SDK, Web and synthetic lifecycle
        run: |
          node scripts/test-rust.mjs
          npm test
      - name: Build optimized executable
        run: cargo build --locked --release --bin dewbow --target "$DEWBOW_TARGET"
      - name: Package and verify the extracted executable
        run: |
          npm run release:pack -- --target "$DEWBOW_TARGET"
          npm run release:check -- --target "$DEWBOW_TARGET"
      - name: Upload distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dewbow-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out reviewed release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's checked distribution files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'dewbow-*' --dir artifacts/download
      - name: Verify checksums and create the release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEWBOW_TAG: ${{ github.ref_name }}
          DEWBOW_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for checksum in artifacts/download/dewbow-*/*.sha256; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done
          options=()
          if [[ "$DEWBOW_VERSION" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$DEWBOW_TAG" artifacts/download/dewbow-*/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Dewbow $DEWBOW_TAG" --notes-file "docs/release-notes/$DEWBOW_VERSION.md" \
            "${options[@]}"
