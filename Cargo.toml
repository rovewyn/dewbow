[workspace]
resolver = "3"
members = ["apps/cli", "apps/daemon", "packages/sdk/rust", "packages/protocol/rust"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3.0.0"
fs2 = "0.4"
futures = "0.3"
getrandom = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2.0"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = "0.26.6"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }
dewbow-protocol = { path = "packages/protocol/rust" }
dewbow-sdk = { path = "packages/sdk/rust" }
dewbow-daemon = { path = "apps/daemon" }

[profile.release]
lto = "thin"
strip = true
