[workspace]
resolver = "3"
members = ["apps/cli", "apps/daemon", "packages/sdk/rust", "packages/protocol/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
dewbow-protocol = { path = "packages/protocol/rust" }
dewbow-sdk = { path = "packages/sdk/rust" }
dewbow-daemon = { path = "apps/daemon" }

[profile.release]
lto = "thin"
strip = true
